{% extends "base.html" %}

{% block title %}Add expense — Spendly{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/add_expense.css') }}">
{% endblock %}

{% block content %}

<section class="add-expense-section">
    <div class="add-expense-container">

        <div class="auth-header">
            <h1 class="auth-title">Add an expense</h1>
            <p class="auth-subtitle">Record a new transaction to track your spending</p>
        </div>

        <div class="auth-card">
            {% if error %}
            <div class="auth-error">{{ error }}</div>
            {% endif %}

            <form method="POST" action="{{ url_for('add_expense') }}" novalidate>
                <div class="form-group">
                    <label for="amount">Amount (₹)</label>
                    <input type="number" id="amount" name="amount"
                           class="form-input" placeholder="0.00"
                           step="0.01" min="0.01"
                           value="{{ amount }}"
                           required autofocus>
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category" class="form-input" required>
                        <option value="" disabled {% if not category %}selected{% endif %}>Select a category</option>
                        <option value="Food" {% if category == "Food" %}selected{% endif %}>Food</option>
                        <option value="Transport" {% if category == "Transport" %}selected{% endif %}>Transport</option>
                        <option value="Bills" {% if category == "Bills" %}selected{% endif %}>Bills</option>
                        <option value="Health" {% if category == "Health" %}selected{% endif %}>Health</option>
                        <option value="Entertainment" {% if category == "Entertainment" %}selected{% endif %}>Entertainment</option>
                        <option value="Shopping" {% if category == "Shopping" %}selected{% endif %}>Shopping</option>
                        <option value="Other" {% if category == "Other" %}selected{% endif %}>Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" name="date"
                           class="form-input"
                           value="{{ date or today }}"
                           required>
                </div>

                <div class="form-group">
                    <label for="description">Description <span class="form-hint">(optional)</span></label>
                    <input type="text" id="description" name="description"
                           class="form-input" placeholder="e.g. Lunch with friends"
                           maxlength="200"
                           value="{{ description or '' }}">
                </div>

                <div class="add-expense-actions">
                    <button type="submit" class="btn-submit">Save Expense</button>
                    <a href="{{ url_for('profile') }}" class="btn-ghost add-expense-cancel">Cancel</a>
                </div>
            </form>
        </div>

    </div>
</section>

{% endblock %}
